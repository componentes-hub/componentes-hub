services:
  web:
    container_name: web_app_container
    env_file:
      - ../.env.docker.dev
    expose:
      - "5000"
    depends_on:
      - db
    build:
      context: ../
      dockerfile: docker/images/Dockerfile.dev
    volumes:
      - ../:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: [ "sh", "-c", "sh /app/docker/entrypoints/development_entrypoint.sh" ]
    networks:
      - componenteshub_network

  db:
    container_name: mariadb_container
    image: mariadb:12.0.2
    restart: always
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: componenteshubdb_root_password
      MARIADB_DATABASE: componenteshubdb
      MARIADB_USER: componenteshubdb_user
      MARIADB_PASSWORD: componenteshubdb_password
    command: >
      --default-authentication-plugin=mysql_native_password
      --bind-address=0.0.0.0
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - componenteshub_network

  nginx:
    container_name: nginx_web_server_container
    image: nginx:1.29.1
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
      - ./nginx/html:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - componenteshub_network

volumes:
  db_data:

networks:
  componenteshub_network:
    driver: bridge  
